
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="contenedor">
        <h1>Formulario de Notas</h1>

        <p class="subtitulo">
            Ingresa tus tres notas y porcentaje de asistencia.
        </p>

        <form method="POST">

            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1"
                   min="10" max="70" step="0.1" required>

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2"
                   min="10" max="70" step="0.1" required>

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3"
                   min="10" max="70" step="0.1" required>

            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia"
                   min="0" max="100" step="0.1" required>

            <button type="submit" class="boton">
                Enviar
            </button>

        </form>

        {% if promedio is not none %}
            <div class="resultado">
                <h2>Resultado</h2>

                <p>Promedio: {{ "%.1f"|format(promedio) }}</p>

                <p class="estado">{{ estado }}</p>
            </div>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <a href="{{ url_for('inicio') }}" class="volver">
            Volver al menú principal
        </a>

    </main>

</body>
</html>
